<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>

<main class="stage">
  <form class="gate-card glass" id="form" autocomplete="off">
    <img src="favicon.png" alt="">
    <h1 class="grad-text">BEDROCK</h1>
    <p id="lead">Enter your access key to continue.</p>
    <label class="sr-only" for="key">Access key</label>
    <input class="field" id="key" type="password" placeholder="ACCESS KEY" autocomplete="off" required>
    <button class="btn btn-primary" id="go" type="submit">Enter</button>
    <p class="gate-msg" id="msg" role="alert"></p>
  </form>
</main>
<div class="credit">Made by James George</div>

<script src="shared.js"></script>
<script>
(function () {
  // Add or change keys here. Matching ignores upper/lower case.
  const KEYS = ['6-7', 'jamb0ne', '0bs1d14n', 'b3dr0ck'];

  Bedrock.space(document.getElementById('space'));

  const form = document.getElementById('form');
  const input = document.getElementById('key');
  const msg = document.getElementById('msg');
  const go = document.getElementById('go');
  const lead = document.getElementById('lead');

  // Opens Bedrock in an about:blank tab and closes this one.
  function launch() {
    const portal = new URL('portal.html', location.href).href;
    const icon = new URL('favicon.png', location.href).href;
    const tab = window.open('about:blank', '_blank');
    if (!tab) {                       // pop-up blocked: open here instead
      location.href = portal;
      return;
    }
    tab.document.open();
    tab.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>Bedrock</title>' +
      '<link rel="icon" href="' + icon + '">' +
      '<style>html,body{margin:0;height:100%;background:#04040b;overflow:hidden}' +
      'iframe{border:0;width:100%;height:100%;display:block}</style></head>' +
      '<body><iframe src="' + portal + '" allow="fullscreen"></iframe></body></html>'
    );
    tab.document.close();
    try { setTimeout(() => window.close(), 400); } catch (_) {}
  }

  if (Bedrock.hasAccess()) {
    // Already signed in on this browser: no key needed, but opening a tab needs a click.
    input.hidden = true; input.required = false;
    lead.textContent = 'You\u2019re signed in.';
    go.textContent = 'Open Bedrock';
    go.focus();
  } else {
    input.focus();
  }

  input.addEventListener('input', () => { input.classList.remove('bad'); msg.textContent = ''; });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (Bedrock.hasAccess() || KEYS.includes(input.value.trim().toLowerCase())) {
      Bedrock.grant();
      launch();
    } else {
      input.classList.add('bad');
      msg.textContent = 'That key isn\u2019t valid. Check it and try again.';
      input.select();
    }
  });
})();
</script>
</body>
</html>
