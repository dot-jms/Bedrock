<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  try { if (localStorage.getItem('bedrock_access_v2') !== 'granted') location.replace('index.html'); }
  catch (_) { location.replace('index.html'); }
</script>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

<div class="wrap">
  <div class="card glass-card ring enter">
    <header class="hdr">
      <div class="logo"><img src="favicon.png" alt="Bedrock logo"></div>
      <div>
        <h1 class="grad-title">Bedrock</h1>
        <div class="muted">friends-only</div>
      </div>
      <div class="sp"></div>
      <button class="exit-btn" id="exit" type="button">Quick exit</button>
    </header>

    <div class="cols">
      <nav class="side" aria-label="Main">
        <div class="brand">BEDROCK</div>
        <a href="#/home" data-route="home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="#/games" data-route="games">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r=".6"/><circle cx="18.5" cy="13.5" r=".6"/></svg>
          Games
        </a>
      </nav>

      <section class="content">
        <div class="view" id="view"></div>
        <div class="foot"><span>Made by James George</span><span>Bedrock Portal • 2025 • V3</span></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="shared.js"></script>
<script src="games.js"></script>
<script>
(function () {
  const GAMES = window.BEDROCK_GAMES;
  const CATS = window.BEDROCK_CATEGORIES;
  const HUES = { arcade: 165, puzzle: 265, strategy: 38, multiplayer: 212, classic: 350, creative: 130 };
  const view = document.getElementById('view');
  const toast = document.getElementById('toast');
  Bedrock.space(document.getElementById('space'));
  Bedrock.particles(document.getElementById('particles'), 14);

  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (_) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
  let favs = load('bedrock_favs', []);

  function say(text) {
    toast.textContent = text; toast.classList.add('show');
    clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  const SEARCH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
  const STAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z"/></svg>';

  function renderHome() {
    view.innerHTML =
      '<div class="home">' +
        '<h2>Welcome back</h2>' +
        '<p class="lead">A collection of browser games. Pick one and it opens in a new tab.</p>' +
        '<div class="cta"><a class="launch sm" href="#/games">BROWSE GAMES</a></div>' +
        '<div class="tip"><h3>Shortcuts</h3><ul class="keys">' +
          '<li><span>Leave this page immediately</span><kbd>`</kbd></li>' +
          '<li><span>Go to Home</span><kbd>Alt + 1</kbd></li>' +
          '<li><span>Go to Games</span><kbd>Alt + 2</kbd></li>' +
        '</ul></div>' +
      '</div>';
  }

  let state, qInput, chips;

  function cell(g) {
    const hue = HUES[g.cat];
    const on = favs.includes(g.id);
    const el = document.createElement('div');
    el.className = 'cell';
    el.innerHTML =
      '<a class="tile" href="' + g.url + '" target="_blank" rel="noopener noreferrer">' +
        '<span class="badge" aria-hidden="true" style="background:linear-gradient(135deg,hsl(' + hue + ' 70% 50%),hsl(' + (hue + 40) + ' 70% 33%))">' + g.name.trim()[0] + '</span>' +
        '<span class="tile-text"><h3></h3><p></p></span>' +
      '</a>' +
      '<button class="fav" type="button" aria-pressed="' + on + '">' + STAR + '</button>';
    el.querySelector('h3').textContent = g.name;
    el.querySelector('p').textContent = g.desc;
    const b = el.querySelector('.fav');
    b.setAttribute('aria-label', (on ? 'Remove ' : 'Add ') + g.name + (on ? ' from favorites' : ' to favorites'));
    b.addEventListener('click', () => {
      favs = on ? favs.filter(x => x !== g.id) : favs.concat(g.id);
      save('bedrock_favs', favs);
      say(on ? 'Removed ' + g.name + ' from favorites' : 'Added ' + g.name + ' to favorites');
      update();
    });
    return el;
  }

  function update() {
    chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === state.cat)));
    const q = qInput.value.trim().toLowerCase();
    const list = GAMES.filter(g =>
      (state.cat === 'all' || (state.cat === 'favs' ? favs.includes(g.id) : g.cat === state.cat)) &&
      (!q || g.name.toLowerCase().includes(q) || g.desc.toLowerCase().includes(q) || g.cat.includes(q)));
    const res = document.getElementById('results');
    res.innerHTML = '';
    if (!list.length) {
      const noFavs = state.cat === 'favs' && !q;
      const e = document.createElement('div'); e.className = 'empty';
      e.innerHTML = '<strong></strong><span></span>';
      e.querySelector('strong').textContent = noFavs ? 'No favorites yet' : 'No games match';
      e.querySelector('span').textContent = noFavs ? 'Select the star on a game to save it here.' : 'Try a different search or category.';
      res.appendChild(e);
    } else list.forEach(g => res.appendChild(cell(g)));
  }

  function renderGames() {
    state = { cat: 'all' };
    view.innerHTML =
      '<div class="lib-head"><h2 class="grad-title">Games</h2>' +
        '<form class="search" role="search" onsubmit="return false">' + SEARCH +
          '<label class="sr-only" for="lib-q">Search games</label>' +
          '<input id="lib-q" type="search" placeholder="Search games" autocomplete="off">' +
        '</form></div>' +
      '<div class="chips" id="chips" role="group" aria-label="Category"></div>' +
      '<div class="grid" id="results"></div>';
    qInput = document.getElementById('lib-q');
    chips = document.getElementById('chips');
    CATS.concat([{ id: 'favs', label: 'Favorites' }]).forEach(c => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = c.label; b.dataset.id = c.id;
      b.addEventListener('click', () => { state.cat = c.id; update(); });
      chips.appendChild(b);
    });
    qInput.addEventListener('input', update);
    update();
  }

  function render() {
    const name = location.hash.replace(/^#\/?/, '') === 'games' ? 'games' : 'home';
    document.querySelectorAll('.side a').forEach(a => {
      if (a.dataset.route === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = name === 'games' ? 'Games – Bedrock' : 'Bedrock';
    view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
    if (name === 'games') renderGames(); else renderHome();
  }
  addEventListener('hashchange', render);
  render();

  function quickExit() {
    // Bedrock may be inside an about:blank frame, so leave from the top window.
    try { window.top.location.replace('https://www.google.com/'); }
    catch (_) { location.replace('https://www.google.com/'); }
  }
  document.getElementById('exit').addEventListener('click', quickExit);
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName);
    if (e.key === '`' && !typing) quickExit();
    if (e.altKey && e.key === '1') { location.hash = '#/home'; e.preventDefault(); }
    if (e.altKey && e.key === '2') { location.hash = '#/games'; e.preventDefault(); }
  });
})();
</script>
</body>
</html>
