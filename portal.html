<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bedrock</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  try { if (localStorage.getItem('bedrock_access_v2') !== 'granted') location.replace('index.html'); }
  catch (_) { location.replace('index.html'); }
</script>
</head>
<body>
<canvas id="space" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div class="particles" id="particles" aria-hidden="true"></div>

<div class="wrap">
  <div class="card glass-card ring enter">
    <header class="hdr">
      <div class="logo"><img src="favicon.png" alt="Bedrock logo"></div>
      <div>
        <h1 class="grad-title">Bedrock</h1>
        <div class="muted">friends-only</div>
      </div>
      <div class="sp"></div>
      <button class="exit-btn" id="exit" type="button">Quick exit</button>
    </header>

    <div class="cols">
      <nav class="side" aria-label="Main">
        <div class="brand">BEDROCK</div>
        <a href="#/home" data-route="home">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>
          Home
        </a>
        <a href="#/games" data-route="games">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r=".6"/><circle cx="18.5" cy="13.5" r=".6"/></svg>
          Games
        </a>
      </nav>

      <section class="content">
        <div class="view" id="view"></div>
        <div class="foot"><span>Made by James George</span><span>Bedrock Portal • 2025 • V3</span></div>
      </section>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  // Where Bedrock Games is hosted (the GitHub Pages address, not the repo page).
  const GAMES_URL = 'https://dot-jms.github.io/Bedrock-games/';

  const view = document.getElementById('view');
  Bedrock.space(document.getElementById('space'));
  Bedrock.particles(document.getElementById('particles'), 14);

  const PAD = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16" cy="11.5" r=".7"/><circle cx="18.5" cy="13.5" r=".7"/></svg>';

  function renderHome() {
    view.innerHTML =
      '<div class="home">' +
        '<h2>Welcome back</h2>' +
        '<p class="lead">Bedrock Games opens from the Games tab in its own about:blank tab.</p>' +
        '<div class="cta"><a class="launch sm" href="#/games">OPEN GAMES</a></div>' +
        '<div class="tip"><h3>Shortcuts</h3><ul class="keys">' +
          '<li><span>Leave this page immediately</span><kbd>`</kbd></li>' +
          '<li><span>Go to Home</span><kbd>Alt + 1</kbd></li>' +
          '<li><span>Go to Games</span><kbd>Alt + 2</kbd></li>' +
        '</ul></div>' +
      '</div>';
  }

  function renderGames() {
    view.innerHTML =
      '<div class="games-hero">' +
        '<div class="orbit" aria-hidden="true"><i></i><i></i><i></i></div>' +
        '<h2 class="grad-title">Bedrock Games</h2>' +
        '<p class="lead">Your game library, opened in its own about:blank tab.</p>' +
        '<button class="launch xl" id="launchGames" type="button">' + PAD + '<span>LAUNCH BEDROCK GAMES</span></button>' +
        '<p class="note">Tab didn\u2019t open? <a href="' + GAMES_URL + '" target="_blank" rel="noopener noreferrer">Open it directly</a></p>' +
      '</div>';
    document.getElementById('launchGames').addEventListener('click', launchGames);
  }

  function launchGames() {
    const icon = new URL('bedrockgamesfavicon.png', location.href).href;
    const tab = window.open('about:blank', '_blank');
    if (!tab) {                                   // pop-ups blocked: open the site directly
      if (!window.open(GAMES_URL, '_blank', 'noopener,noreferrer')) window.top.location.href = GAMES_URL;
      return;
    }
    tab.document.open();
    tab.document.write(
      '<!doctype html><html><head><meta charset="utf-8"><title>Bedrock Games</title>' +
      '<link rel="icon" href="' + icon + '">' +
      '<style>html,body{margin:0;height:100%;background:#04040a;overflow:hidden}' +
      'iframe{border:0;width:100%;height:100%;display:block}</style></head>' +
      '<body><iframe src="' + GAMES_URL + '" allow="fullscreen; autoplay; gamepad"></iframe></body></html>'
    );
    tab.document.close();
  }

  function render() {
    const name = location.hash.replace(/^#\/?/, '') === 'games' ? 'games' : 'home';
    document.querySelectorAll('.side a').forEach(a => {
      if (a.dataset.route === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.title = name === 'games' ? 'Games \u2013 Bedrock' : 'Bedrock';
    view.style.animation = 'none'; void view.offsetWidth; view.style.animation = '';
    if (name === 'games') renderGames(); else renderHome();
  }
  addEventListener('hashchange', render);
  render();

  function quickExit() {
    // Bedrock may be inside an about:blank frame, so leave from the top window.
    try { window.top.location.replace('https://www.google.com/'); }
    catch (_) { location.replace('https://www.google.com/'); }
  }
  document.getElementById('exit').addEventListener('click', quickExit);
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName);
    if (e.key === '`' && !typing) quickExit();
    if (e.altKey && e.key === '1') { location.hash = '#/home'; e.preventDefault(); }
    if (e.altKey && e.key === '2') { location.hash = '#/games'; e.preventDefault(); }
  });
})();
</script>
</body>
</html>
